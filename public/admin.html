<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard · Cauayan Flood Alert</title><link rel="stylesheet" href="/style.css"></head>
<body class="sunny"><main class="container form-container"><nav class="topbar"><span class="eyebrow">ADMINISTRATION</span><a class="quiet-link" href="/">View public alerts</a></nav><header class="admin-head"><div><p class="eyebrow">CAUAYAN CITY · ISABELA</p><h1>Alert Dashboard</h1></div><button id="logout" class="button button-secondary" type="button">Logout</button></header><p class="location">Changes are published to the public alert page.</p><form id="alert-form" class="card admin-card"><div class="field"><label for="signal">Tropical Cyclone Warning Signal</label><select id="signal" name="signal"><option value="NO ACTIVE SIGNAL">No Signal</option><option value="SIGNAL NO. 1">Signal 1</option><option value="SIGNAL NO. 2">Signal 2</option><option value="SIGNAL NO. 3">Signal 3</option><option value="SIGNAL NO. 4">Signal 4</option><option value="SIGNAL NO. 5">Signal 5</option></select></div><div class="field"><label for="flood">Overall Flood Status</label><select id="flood" name="flood"><option>No Flooding</option><option>Flooding Reported</option><option>Critical Flooding</option></select></div><div class="field"><label for="locations">Affected locations / barangays</label><textarea id="locations" name="locations" placeholder="One location per line, e.g. Barangay San Fermin"></textarea><small>Enter one barangay or area per line. Leave blank if none are affected.</small></div><div class="field"><label for="flood-level">Flood Level Percentage</label><select id="flood-level" name="flood_level_percentage"></select></div><section class="admin-level-preview" aria-label="Flood level live preview"><p class="card-label">LIVE PREVIEW</p><div class="level-layout"><div class="level-graphic" data-level-visualizer aria-label="Flood level preview"><svg viewBox="0 0 220 190" role="img" aria-label="Building with rising flood water"><defs><clipPath id="admin-building-clip"><path d="M46 65 110 20l64 45v112H46z"/></clipPath></defs><g class="water-fill" clip-path="url(#admin-building-clip)"><rect class="water-body" x="30" y="0" width="160" height="190"/><path class="water-wave" d="M20 0 Q40 -10 60 0 T100 0 T140 0 T180 0 T220 0 V190 H20Z"/></g><path class="building" d="M46 65 110 20l64 45v112H46z M84 177v-43a26 26 0 0 1 52 0v43 M62 82h24v24H62z M134 82h24v24h-24z"/><path class="building-detail" d="M110 21v156 M46 65h128"/></svg><div class="level-ticks" aria-hidden="true"><span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span></div></div><div class="level-summary"><strong data-level-value>0%</strong><span data-level-label>No flooding</span></div></div></section><button class="button button-primary" type="submit">Update Alert Status</button><p id="message" class="form-message" role="status"></p></form></main><script type="module" src="/admin.js"></script></body></html>
