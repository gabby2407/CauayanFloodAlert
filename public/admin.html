<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard · Cauayan Flood Alert</title><link rel="stylesheet" href="/style.css"></head>
<body class="sunny"><main class="container form-container"><nav class="topbar"><span class="eyebrow">ADMINISTRATION</span><a class="quiet-link" href="/">View public alerts</a></nav><header class="admin-head"><div><p class="eyebrow">CAUAYAN CITY • ISABELA</p><h1>Alert Dashboard</h1></div><button id="logout" class="button button-secondary" type="button">Logout</button></header><p class="location">Changes are published to the public alert page.</p><form id="alert-form" class="card admin-card"><div class="field"><label for="signal">Tropical Cyclone Warning Signal</label><select id="signal" name="signal"><option value="NO ACTIVE SIGNAL">No Signal</option><option value="SIGNAL NO. 1">Signal 1</option><option value="SIGNAL NO. 2">Signal 2</option><option value="SIGNAL NO. 3">Signal 3</option><option value="SIGNAL NO. 4">Signal 4</option><option value="SIGNAL NO. 5">Signal 5</option></select></div><div class="field"><label for="flood">Overall Flood Status</label><select id="flood" name="flood"><option>No Flooding</option><option>Flooding Reported</option><option>Critical Flooding</option></select></div><div class="field"><label for="locations">Affected locations / barangays</label><textarea id="locations" name="locations" placeholder="One location per line, e.g. Barangay San Fermin"></textarea><small>Enter one barangay or area per line. Leave blank if none are affected.</small></div><button class="button button-primary" type="submit">Update Alert Status</button><p id="message" class="form-message" role="status"></p></form></main><script type="module" src="/admin.js"></script></body></html>
