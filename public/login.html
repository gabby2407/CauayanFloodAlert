<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · Cauayan Flood Alert</title><link rel="stylesheet" href="/style.css"></head>
<body class="sunny"><main class="container form-container"><nav class="topbar"><span class="eyebrow">CAUAYAN CITY FLOOD ALERT</span><a class="quiet-link" href="/">Public alerts</a></nav><header class="hero"><p class="eyebrow">AUTHORIZED ACCESS</p><h1>Admin Login</h1><p class="location">Sign in to manage public alerts.</p></header><form id="login-form" class="card form-card"><h2>Welcome back</h2><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button button-primary" type="submit">Sign in</button><p id="message" class="form-message" role="status"></p><div class="form-links"><a href="/">Return to public alerts</a></div></form></main><script type="module" src="/login.js"></script></body></html>
